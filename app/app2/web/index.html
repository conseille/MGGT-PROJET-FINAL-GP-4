<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smart City IoT - MGGT1103 - Groupe 4</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    section { border: 1px solid #aaa; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
    input, button { padding: .65rem; margin: .2rem; }
    pre { min-height: 10rem; white-space: pre-wrap; background: #111; color: #eee; padding: 1rem; }
  </style>
<style id="mggt-personnalisation">
  :root {
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    max-width: 1240px;
    margin: 0 auto;
    padding: 32px;
    background: #f7f8fa;
  }

  h1 {
    margin-bottom: 8px;
    font-size: 2.2rem;
  }

  .mggt-subtitle {
    font-size: 1.05rem;
    margin-bottom: 28px;
  }

  #topic {
    min-width: 390px;
  }

  #message {
    min-width: 390px;
  }

  input {
    padding: 12px;
    margin: 6px;
    border: 1px solid #aaa;
    border-radius: 6px;
    font-size: 1rem;
  }

  button {
    padding: 12px 20px;
    margin: 6px;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid #888;
    font-weight: 600;
  }

  #log {
    min-height: 260px;
    padding: 20px;
    margin-top: 24px;
    border-radius: 8px;
    overflow: auto;
    line-height: 1.45;
  }
</style>
</head>
<body>
  <h1>Smart City IoT - MGGT1103 - Groupe 4</h1>
  <p>Université Espoir d’Afrique — Plateforme Smart City IoT — Eclipse Mosquitto sur Kubernetes.</p>

  <section>
    <label>Hôte <input id="host" value="192.168.1.122"></label>
    <label>Port <input id="port" value="9001"></label>
    <button id="connect">Connecter</button>
  </section>

  <section>
    <label>Sujet <input id="topic" value="smartcity/capteurs/temperature"></label>
    <label>Message <input id="message" value='{"site":"campus","valeur":24,"unite":"C"}'></label>
    <button id="publish">Publier</button>
  </section>

  <pre id="log">Prêt.</pre>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script>
    let client;
    const log = document.getElementById("log");
    const write = (text) => {
      log.textContent += "\n" + new Date().toISOString() + " " + text;
    };

    document.getElementById("connect").onclick = () => {
      const host = document.getElementById("host").value;
      const port = document.getElementById("port").value;
      const topic = document.getElementById("topic").value;

      client = mqtt.connect(`ws://${host}:${port}`);

      client.on("connect", () => {
        write("Connecté au broker.");
        client.subscribe(topic);
      });

      client.on("message", (receivedTopic, payload) => {
        write(`${receivedTopic}: ${payload.toString()}`);
      });

      client.on("error", (error) => write(`Erreur: ${error.message}`));
    };

    document.getElementById("publish").onclick = () => {
      if (!client || !client.connected) {
        write("Connexion requise.");
        return;
      }

      client.publish(
        document.getElementById("topic").value,
        document.getElementById("message").value
      );
    };
  </script>
</body>
</html>
