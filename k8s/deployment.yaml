apiVersion: v1
kind: ConfigMap
metadata:
  name: mqtt-web-config
  namespace: mggt-smartcity
data:
  index.html: |
    <!doctype html>
    <html lang="fr">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>Smart City MQTT - Groupe 4</title>
      <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        section { border: 1px solid #aaa; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
        input, button { padding: .65rem; margin: .2rem; }
        pre { min-height: 10rem; white-space: pre-wrap; background: #111; color: #eee; padding: 1rem; }
      </style>
    </head>
    <body>
      <h1>Smart City MQTT - Groupe 4</h1>
      <p>Interface Kubernetes de démonstration Eclipse Mosquitto.</p>
      <section>
        <label>Sujet <input id="topic" value="smartcity/capteurs/temperature"></label>
        <label>Message <input id="message" value='{"site":"campus","valeur":24,"unite":"C"}'></label>
        <button id="connect">Connecter</button>
        <button id="publish">Publier</button>
      </section>
      <pre id="log">Prêt.</pre>
      <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
      <script>
        let client;
        const log = document.getElementById("log");
        const write = (text) => {
          log.textContent += "\n" + new Date().toISOString() + " " + text;
        };

        document.getElementById("connect").onclick = () => {
          const protocol = window.location.protocol === "https:" ? "wss" : "ws";
          client = mqtt.connect(`${protocol}://${window.location.host}/mqtt`);

          client.on("connect", () => {
            write("Connecté au broker.");
            client.subscribe(document.getElementById("topic").value);
          });

          client.on("message", (topic, payload) => {
            write(`${topic}: ${payload.toString()}`);
          });

          client.on("error", (error) => write(`Erreur: ${error.message}`));
        };

        document.getElementById("publish").onclick = () => {
          if (!client || !client.connected) {
            write("Connexion requise.");
            return;
          }

          client.publish(
            document.getElementById("topic").value,
            document.getElementById("message").value
          );
        };
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-nodered
  namespace: mggt-smartcity
  labels:
    app: app1-nodered
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app1-nodered
  template:
    metadata:
      labels:
        app: app1-nodered
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: app1-nodered
      containers:
        - name: nodered
          image: REGISTRY_PLACEHOLDER/mggt-gp4-nodered:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 1880
          readinessProbe:
            httpGet:
              path: /smart-city
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /smart-city
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-mqtt
  namespace: mggt-smartcity
  labels:
    app: app2-mqtt
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app2-mqtt
  template:
    metadata:
      labels:
        app: app2-mqtt
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: app2-mqtt
      containers:
        - name: mosquitto
          image: REGISTRY_PLACEHOLDER/mggt-gp4-mosquitto:latest
          imagePullPolicy: Always
          ports:
            - name: mqtt
              containerPort: 1883
            - name: websocket
              containerPort: 9001
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi

        - name: mqtt-web
          image: REGISTRY_PLACEHOLDER/mggt-gp4-mqtt-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: mqtt-web-config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: mqtt-web-config
          configMap:
            name: mqtt-web-config
