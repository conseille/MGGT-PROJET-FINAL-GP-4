---
- name: Vérifier l'interface K3s du Master
  ansible.builtin.assert:
    that:
      - k3s_interface is defined
      - k3s_interface | length > 0
      - k3s_interface in ansible_interfaces
    fail_msg: >-
      L'interface K3s {{ k3s_interface | default('NON_DEFINIE') }}
      n'est pas présente sur le Master.

- name: Lire l'adresse IPv4 courante de l'interface K3s
  ansible.builtin.command:
    cmd: "ip -4 -o addr show dev {{ k3s_interface }} scope global"
  register: k3s_interface_ipv4
  changed_when: false
  check_mode: false

- name: Vérifier qu'une IPv4 LAN est disponible
  ansible.builtin.assert:
    that:
      - k3s_interface_ipv4.stdout | trim | length > 0
    fail_msg: >-
      Aucune adresse IPv4 n'est disponible sur {{ k3s_interface }}.
      K3s ne sera pas configuré avec une adresse obsolète.

- name: Déterminer dynamiquement l'adresse IPv4 K3s
  ansible.builtin.set_fact:
    k3s_server_ip: >-
      {{ k3s_interface_ipv4.stdout.split()[3].split('/')[0] }}

- name: Valider l'adresse IPv4 K3s découverte
  ansible.builtin.assert:
    that:
      - k3s_server_ip in ansible_all_ipv4_addresses
    fail_msg: >-
      L'adresse découverte {{ k3s_server_ip }} n'est pas présente
      sur le Master.
    success_msg: >-
      Réseau K3s dynamique validé :
      {{ k3s_server_ip }} sur {{ k3s_interface }}.

- name: Créer le groupe des administrateurs K3s
  ansible.builtin.group:
    name: "{{ k3s_admin_group }}"
    state: present

- name: Ajouter les administrateurs au groupe K3s
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "{{ k3s_admin_group }}"
    append: true
  loop: "{{ k3s_admin_users }}"

- name: Créer le dossier de configuration K3s
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Déployer la configuration sécurisée K3s
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Redémarrer K3s

- name: Télécharger le programme officiel d'installation K3s
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/src/install-k3s.sh
    owner: root
    group: root
    mode: "0755"
    force: false

- name: Installer K3s Server
  ansible.builtin.command:
    cmd: /usr/local/src/install-k3s.sh
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: server

- name: Activer et démarrer K3s
  ansible.builtin.systemd_service:
    name: k3s
    state: started
    enabled: true

- name: Appliquer immédiatement les handlers K3s
  ansible.builtin.meta: flush_handlers

- name: Attendre l'API Kubernetes
  when: not ansible_check_mode
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 6443
    timeout: 240

- name: Attendre que le Master soit Ready
  when: not ansible_check_mode
  ansible.builtin.command:
    cmd: >-
      k3s kubectl get node {{ k3s_node_name }}
      -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: k3s_master_ready
  changed_when: false
  retries: 30
  delay: 5
  until: k3s_master_ready.stdout == "True"

- name: Créer le dossier kubeconfig de l'administrateur
  ansible.builtin.file:
    path: "{{ k3s_kubeconfig_home }}/.kube"
    state: directory
    owner: "{{ k3s_kubeconfig_user }}"
    group: "{{ k3s_kubeconfig_group }}"
    mode: "0700"

- name: Lire le kubeconfig système
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_system_kubeconfig
  no_log: true

- name: Installer le kubeconfig de l'administrateur
  ansible.builtin.copy:
    content: >-
      {{
        (k3s_system_kubeconfig.content | b64decode)
        | regex_replace(
            'https://127[.]0[.]0[.]1:6443',
            'https://' ~ k3s_server_ip ~ ':6443'
          )
      }}
    dest: "{{ k3s_kubeconfig_home }}/.kube/config"
    owner: "{{ k3s_kubeconfig_user }}"
    group: "{{ k3s_kubeconfig_group }}"
    mode: "0600"
  no_log: true

- name: Attendre que CoreDNS soit disponible
  when: not ansible_check_mode
  ansible.builtin.command:
    cmd: >-
      k3s kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
      rollout status deployment/coredns
      --namespace kube-system
      --timeout=15s
  register: k3s_coredns_status
  changed_when: false
  retries: 20
  delay: 10
  until: k3s_coredns_status.rc == 0

- name: Attendre que Traefik soit disponible
  when: not ansible_check_mode
  ansible.builtin.command:
    cmd: >-
      k3s kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
      rollout status deployment/traefik
      --namespace kube-system
      --timeout=15s
  register: k3s_traefik_status
  changed_when: false
  retries: 20
  delay: 10
  until: k3s_traefik_status.rc == 0
