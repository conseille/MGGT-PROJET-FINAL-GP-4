name: CI Conteneurs Smart City

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/container-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/container-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-compose:
    name: Validation Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6.0.2

      - name: Valider docker-compose.yml
        run: docker compose -f app/docker-compose.yml config

  containers:
    name: Hadolint, build, Trivy et push — ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs:
      - validate-compose

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nodered
            context: app/app1
            dockerfile: app/app1/Dockerfile
          - name: mosquitto
            context: app/app2
            dockerfile: app/app2/Dockerfile
          - name: mqtt-web
            context: app/app2/web
            dockerfile: app/app2/web/Dockerfile

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/mggt-gp4-${{ matrix.name }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6.0.2

      - name: Contrôler le Dockerfile avec Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: warning
          no-color: true

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire l'image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Publier les images dans GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Résumé
        run: |
          {
            echo "### Image ${{ matrix.name }}"
            echo "- Hadolint : exécuté"
            echo "- Build Docker : réussi"
            echo "- Trivy : exécuté"
            if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
              echo "- Publication GHCR : effectuée"
            else
              echo "- Publication GHCR : non requise pour cet événement"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
